<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>Finance Prototype</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1f2937}
  header{background:#0f766e;color:#fff;padding:14px 16px;font-size:18px;font-weight:600}
  main{max-width:520px;margin:0 auto;padding:12px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  h2{margin:0 0 10px;font-size:15px;color:#0f766e}
  label{display:block;font-size:13px;margin:10px 0 4px;color:#4b5563}
  input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
  textarea{min-height:80px;resize:vertical}
  button{padding:12px 14px;font-size:16px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer}
  button.secondary{background:#e5e7eb;color:#111827}
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1}
  .status{display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .online{background:#d1fae5;color:#065f46}
  .offline{background:#fee2e2;color:#991b1b}
  .pending{background:#fef3c7;color:#92400e}
  .synced{background:#d1fae5;color:#065f46}
  #msg{font-size:14px;margin-top:10px;min-height:18px;color:#374151;word-break:break-word}
  .item{border-top:1px solid #eee;padding:8px 0;font-size:14px}
  .item small{color:#6b7280;display:block;word-break:break-all}
  .top{display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>
<header>Finance Prototype (Phase 1)</header>
<main>

  <div class="card">
    <div class="status">
      <span id="net" class="pill online">Online</span>
      <span>Pending: <b id="pendingCount">0</b></span>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>Connection settings (saved only on this device)</h2>
    <label>Backend URL (Apps Script Web app URL)</label>
    <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    <label>Secret token</label>
    <input id="cfgToken" type="password" autocomplete="off">
    <div class="row">
      <button class="secondary" id="btnSaveCfg">Save settings</button>
      <button class="secondary" id="btnPing">Test connection</button>
    </div>
  </div>

  <div class="card">
    <h2>Add test entry</h2>
    <label>Date</label>
    <input id="fDate" type="date">
    <label>Type</label>
    <select id="fType">
      <option>Income</option>
      <option selected>Expense</option>
      <option>Deposit</option>
      <option>Withdrawal</option>
    </select>
    <label>Amount</label>
    <input id="fAmount" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
    <label>Details</label>
    <textarea id="fDetails" placeholder="Where / why (Bangla is OK)"></textarea>
    <div class="row">
      <button id="btnSave">Save</button>
      <button class="secondary" id="btnSync">Sync now</button>
    </div>
  </div>

  <div class="card">
    <h2>Entries on this device</h2>
    <div id="list"></div>
    <div class="row">
      <button class="secondary" id="btnDup">Duplicate test</button>
      <button class="secondary" id="btnClear">Clear synced</button>
    </div>
  </div>

</main>

<script>
const DB_NAME = 'fin-proto';
const STORE = 'queue';
const $ = id => document.getElementById(id);

/* ---------- IndexedDB helpers ---------- */
function openDb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'entryId' });
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function tx(mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const rq = fn(t.objectStore(STORE));
    t.oncomplete = () => resolve(rq ? rq.result : undefined);
    t.onerror = () => reject(t.error);
  });
}
const putEntry = e => tx('readwrite', s => s.put(e));
const delEntry = id => tx('readwrite', s => s.delete(id));
const allEntries = () => tx('readonly', s => s.getAll());

/* ---------- Settings (localStorage, this device only) ---------- */
function getCfg() {
  try {
    return {
      url: localStorage.getItem('fin_url') || '',
      token: localStorage.getItem('fin_token') || ''
    };
  } catch (e) { return { url: '', token: '' }; }
}
function setCfg(url, token) {
  try {
    localStorage.setItem('fin_url', url);
    localStorage.setItem('fin_token', token);
  } catch (e) { setMsg('Could not save settings on this device.'); }
}

/* ---------- Utilities ---------- */
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function setMsg(t) { $('msg').textContent = t; }
function todayStr() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}

/* ---------- Network call (text/plain avoids CORS preflight) ---------- */
async function post(cfg, payload) {
  payload.token = cfg.token;
  const r = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await r.json();
}

/* ---------- Sync ---------- */
let syncing = false;
async function syncNow() {
  if (syncing) return;
  if (!navigator.onLine) { setMsg('Offline. Entries will sync when internet returns.'); return; }
  const cfg = getCfg();
  if (!cfg.url || !cfg.token) { setMsg('Please save Backend URL and Token first.'); return; }
  syncing = true;
  try {
    const list = (await allEntries())
      .filter(e => e.status !== 'synced')
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    let sent = 0;
    for (const e of list) {
      const resp = await post(cfg, {
        action: 'addEntry',
        entry: { entryId: e.entryId, date: e.date, type: e.type, amount: e.amount, details: e.details }
      });
      if (resp.ok) {
        e.status = 'synced';
        e.duplicate = !!resp.duplicate;
        e.syncedAt = new Date().toISOString();
        await putEntry(e);
        sent++;
      } else {
        setMsg('Server rejected: ' + resp.error);
        break;
      }
    }
    if (sent > 0) setMsg('Synced ' + sent + ' entr' + (sent === 1 ? 'y' : 'ies') + '.');
  } catch (err) {
    setMsg('Sync failed, will retry: ' + err.message);
  } finally {
    syncing = false;
    render();
  }
}

/* ---------- UI actions ---------- */
async function saveEntry() {
  const amount = parseFloat($('fAmount').value);
  if (!$('fDate').value) { setMsg('Please choose a date.'); return; }
  if (!(amount > 0)) { setMsg('Please enter a valid amount.'); return; }
  const entry = {
    entryId: uuid(),
    date: $('fDate').value,
    type: $('fType').value,
    amount: amount,
    details: $('fDetails').value.trim(),
    status: 'pending',
    createdAt: new Date().toISOString()
  };
  await putEntry(entry);
  $('fAmount').value = '';
  $('fDetails').value = '';
  setMsg(navigator.onLine ? 'Saved on device. Syncing...' : 'Saved on device. Will sync when online.');
  await render();
  syncNow();
}

async function testConnection() {
  const cfg = getCfg();
  if (!cfg.url || !cfg.token) { setMsg('Save Backend URL and Token first.'); return; }
  if (!navigator.onLine) { setMsg('You are offline.'); return; }
  try {
    const resp = await post(cfg, { action: 'ping' });
    setMsg(resp.ok ? 'Connection OK: ' + resp.message : 'Backend replied: ' + resp.error);
  } catch (err) {
    setMsg('Connection failed: ' + err.message);
  }
}

async function duplicateTest() {
  const cfg = getCfg();
  const list = (await allEntries()).filter(e => e.status === 'synced');
  if (!list.length) { setMsg('No synced entry to test yet.'); return; }
  if (!navigator.onLine) { setMsg('You are offline.'); return; }
  const e = list[list.length - 1];
  try {
    const resp = await post(cfg, {
      action: 'addEntry',
      entry: { entryId: e.entryId, date: e.date, type: e.type, amount: e.amount, details: e.details }
    });
    setMsg(resp.ok && resp.duplicate
      ? 'PASS: backend ignored the duplicate (no new row added).'
      : 'Result: ' + JSON.stringify(resp));
  } catch (err) {
    setMsg('Test failed: ' + err.message);
  }
}

async function clearSynced() {
  const list = (await allEntries()).filter(e => e.status === 'synced');
  for (const e of list) await delEntry(e.entryId);
  setMsg('Cleared synced entries from this device (they stay in your Sheet).');
  render();
}

/* ---------- Render ---------- */
async function render() {
  const net = $('net');
  net.textContent = navigator.onLine ? 'Online' : 'Offline';
  net.className = 'pill ' + (navigator.onLine ? 'online' : 'offline');

  const list = (await allEntries()).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  $('pendingCount').textContent = list.filter(e => e.status !== 'synced').length;

  const box = $('list');
  box.innerHTML = '';
  if (!list.length) {
    const p = document.createElement('div');
    p.className = 'item';
    p.textContent = 'No entries yet.';
    box.appendChild(p);
    return;
  }
  list.forEach(e => {
    const div = document.createElement('div');
    div.className = 'item';
    const top = document.createElement('div');
    top.className = 'top';
    const left = document.createElement('span');
    left.textContent = e.date + ' | ' + e.type + ' | ' + e.amount;
    const pill = document.createElement('span');
    pill.className = 'pill ' + (e.status === 'synced' ? 'synced' : 'pending');
    pill.textContent = e.status === 'synced' ? 'Synced' : 'Pending';
    top.appendChild(left);
    top.appendChild(pill);
    const small = document.createElement('small');
    small.textContent = e.details || '(no details)';
    div.appendChild(top);
    div.appendChild(small);
    box.appendChild(div);
  });
}

/* ---------- Init ---------- */
window.addEventListener('online', () => { setMsg('Back online. Syncing...'); render(); syncNow(); });
window.addEventListener('offline', () => { setMsg('You are offline. Entries will be kept on this device.'); render(); });

$('btnSave').addEventListener('click', saveEntry);
$('btnSync').addEventListener('click', syncNow);
$('btnPing').addEventListener('click', testConnection);
$('btnDup').addEventListener('click', duplicateTest);
$('btnClear').addEventListener('click', clearSynced);
$('btnSaveCfg').addEventListener('click', () => {
  setCfg($('cfgUrl').value.trim(), $('cfgToken').value.trim());
  setMsg('Settings saved on this device.');
});

(function init() {
  $('fDate').value = todayStr();
  const cfg = getCfg();
  $('cfgUrl').value = cfg.url;
  $('cfgToken').value = cfg.token;
  render();
  syncNow();
  setInterval(() => { if (navigator.onLine) syncNow(); }, 30000);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
